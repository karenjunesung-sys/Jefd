<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘 두 문장 🌷</title><meta name="theme-color" content="#ffe6d7"><meta name="description" content="하루 두 문장, 영어 일본어 프랑스어 독일어를 함께 연습해요"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><style>:root{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#4a3c38;background:#fff9ef}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#ffe4cf,transparent 42%),#fff9ef}.wrap{max-width:740px;margin:auto;padding:26px 17px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:28px;color:#c76d5d}.logo img{width:48px;height:48px;border-radius:15px;box-shadow:0 3px 10px #dba98c70}.pill{border-radius:99px;background:#fff;padding:9px 13px;color:#a16a58;font-size:13px}.hero{margin:22px 0;padding:25px;border-radius:28px;background:#ffe6d7;box-shadow:0 8px 28px #e8bca04d}.hero h1{margin:0 0 8px;font-size:29px}.hero p{margin:0;line-height:1.7;color:#86665a}.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:0;border-radius:15px;padding:11px 15px;background:#f5b58c;color:#4d3227;font-weight:700}button:focus-visible{outline:3px solid #9a6559;outline-offset:2px}button.secondary{background:#fff;color:#9b6553}.card{background:white;border:1px solid #f1e5db;border-radius:24px;padding:20px;margin:17px 0;box-shadow:0 6px 20px #aa80631a}.langhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.langhead h2{margin:0;font-size:20px}.sentence{padding:16px 0;border-top:1px dashed #eddcd2}.native{font-size:23px;font-weight:750;line-height:1.45;margin:8px 0}.meaning{font-size:14px;color:#a07161;margin:3px 0}.reading{color:#76665e;margin:7px 0 12px;font-size:15px}.speak{background:#e9f5ed;color:#3c795c}.hint{background:#fff3dc;padding:13px 15px;border-radius:15px;font-size:14px;line-height:1.6}.muted{color:#947e73;font-size:13px;line-height:1.6}.history-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:15px}.history-nav input{font:inherit;border:1px solid #e5c9ba;background:white;color:#4a3c38;border-radius:12px;padding:10px;min-width:145px;flex:1}.history-nav button{padding:10px 12px}.history-note{font-size:12px;color:#906f61;margin-top:8px}.dot{border:0;cursor:pointer}.dot:disabled{opacity:.38;cursor:not-allowed}.progress{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.dot{border-radius:10px;padding:8px 10px;background:#fff;color:#ab8c79;font-size:12px}.dot.on{background:#ce806b;color:white}.footer{text-align:center;color:#a18b80;font-size:13px;margin-top:24px}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#4e3b35;color:white;padding:12px 17px;border-radius:16px;display:none;max-width:90vw;text-align:center}</style></head><body><main class="wrap"><div class="top"><div class="logo"><img src="./icon-192.png" alt="오늘 두 문장 꽃 로고">오늘 두 문장</div><div class="pill" id="date"></div></div><section class="hero"><h1 id="headline">오늘도 두 문장씩 🌼</h1><p id="sub">하루 2문장, 세 가지 언어. 천천히 따라 말해요!</p><div class="actions"><button id="share">💌 앱 공유하기</button><button class="secondary" id="install">📲 홈 화면에 추가</button><button class="secondary" id="toggle">📚 이번 주 복습</button></div><div class="history-nav"><button class="secondary" id="prev">〈 이전 날</button><input type="date" id="pick" min="2026-10-12" aria-label="복습할 날짜 선택"><button class="secondary" id="next">다음 날 〉</button><button class="secondary" id="today">오늘로</button></div><div class="history-note">🌷 지난 날짜를 선택하면 앱에 저장된 그날의 문장을 볼 수 있어요.</div><div class="progress" id="days"></div></section><div id="content"></div></main><div id="toast" role="status"></div><script>

[{de:"Wie spät ist es?",deR:"비 슈페트 이스트 에스",ko:'몇 시예요?',en:'What time is it?',enR:'왓 타임 이짓',ja:'何時ですか？',jaR:'난지 데스카',fr:'Il est quelle heure ?',frR:'일 에 켈 외흐',tip:'heure의 h는 발음하지 않아요.'},{de:"Ich gehe jetzt los.",deR:"이히 게에 예츠트 로스",ko:'지금 출발해요.',en:'I’m leaving now.',enR:'아임 리빙 나우',ja:'今、出発します。',jaR:'이마 슛파츠시마스',fr:'Je pars maintenant.',frR:'쥬 파흐 맹트낭',tip:'maintenant의 끝 t는 읽지 않아요.'}],

const tz='Asia/Seoul';let reviewOverride=false;let selectedDate=null;let current='';function parts(d){let x=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',hourCycle:'h23'}).formatToParts(d);return Object.fromEntries(x.map(p=>[p.type,p.value]));}function dayInfo(key){let p=parts(new Date());let day=new Date(`${p.year}-${p.month}-${p.day}T12:00:00Z`);if(+p.hour<7)day.setUTCDate(day.getUTCDate()-1);if(key)day=new Date(`${key}T12:00:00Z`);let wd=day.getUTCDay(),mon=new Date(day);mon.setUTCDate(mon.getUTCDate()-((wd+6)%7));let base=Date.UTC(2026,9,12,12);let week=Math.floor((mon.getTime()-base)/(7*86400000));let idx=((week%2)+2)%2;let offset=idx*5;return {day,wd,offset,key:day.toISOString().slice(0,10)}}
function say(text,lang){if(!('speechSynthesis'in window)){toast('이 브라우저는 음성 읽기를 지원하지 않아요.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang==='fr-FR'?.82:lang==='de-DE'?.83:.86;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase()===lang.toLowerCase())||voices.find(v=>v.lang.startsWith(lang.slice(0,2)));if(v)u.voice=v;speechSynthesis.speak(u)}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.toaster);window.toaster=setTimeout(()=>e.style.display='none',2600)}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let todayInfo=dayInfo();let d=dayInfo(selectedDate);current=todayInfo.key;let weekend=d.wd===0||d.wd===6;let review=weekend||reviewOverride;document.getElementById('date').textContent=new Intl.DateTimeFormat('ko-KR',{timeZone:tz,month:'long',day:'numeric',weekday:'long'}).format(new Date(d.key+'T12:00:00Z'));document.getElementById('pick').value=d.key;document.getElementById('pick').max=todayInfo.key;document.getElementById('prev').disabled=d.key<='2026-10-12';document.getElementById('next').disabled=d.key>=todayInfo.key;document.getElementById('today').disabled=d.key===todayInfo.key;document.getElementById('headline').textContent=review?'📚 이번 주 문장 복습':'☀️ 오늘도 두 문장!';document.getElementById('sub').textContent=review?'월요일부터 금요일까지 배운 문장을 다시 말해봐요.':'';document.getElementById('toggle').textContent=reviewOverride?'🌷 오늘 학습으로':'📚 이번 주 복습';document.getElementById('toggle').disabled=weekend;document.getElementById('days').innerHTML=['월','화','수','목','금','토','일'].map((x,i)=>{let dt=new Date(d.day);dt.setUTCDate(dt.getUTCDate()+i-((d.wd+6)%7));let k=dt.toISOString().slice(0,10);return `<button class="dot ${k===d.key?'on':''}" data-day="${k}" ${k>todayInfo.key||k<'2026-10-12'?'disabled':''}>${x}${i>=5?' · 복습':''}</button>`}).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.day;reviewOverride=false;render()});let idx=(d.wd+6)%7;let pairs=review?lessons.slice(d.offset,d.offset+5).flat():lessons[d.offset+Math.min(idx,4)];let languages=[['🇺🇸 영어','en','enR','en-US'],['🇯🇵 일본어','ja','jaR','ja-JP'],['🇫🇷 프랑스어','fr','frR','fr-FR'],['🇩🇪 독일어','de','deR','de-DE']];document.getElementById('content').innerHTML=languages.map(([title,key,read,locale])=>`<section class="card"><div class="langhead"><h2>${title}</h2><span class="pill">${review?'10문장 복습':'오늘의 2문장'}</span></div>${pairs.map((s,i)=>`<div class="sentence"><div class="meaning">${i+1}. ${esc(s.ko)}</div><div class="native">${esc(s[key])}</div><div class="reading">🔤 ${esc(s[read])}</div><button class="speak" data-lang="${locale}" data-text="${encodeURIComponent(s[key])}">🔊 듣고 따라하기</button>${key==='fr'?`<div class="hint" style="margin-top:12px">💡 ${esc(s.tip)}</div>`:''}</div>`).join('')}</section>`).join('');document.querySelectorAll('.speak').forEach(b=>b.onclick=()=>say(decodeURIComponent(b.dataset.text),b.dataset.lang))}
function shiftDay(n){let d=dayInfo(selectedDate).day;d.setUTCDate(d.getUTCDate()+n);selectedDate=d.toISOString().slice(0,10);reviewOverride=false;render()}document.getElementById('prev').onclick=()=>shiftDay(-1);document.getElementById('next').onclick=()=>shiftDay(1);document.getElementById('today').onclick=()=>{selectedDate=null;reviewOverride=false;render()};document.getElementById('pick').onchange=e=>{if(e.target.value>dayInfo().key||e.target.value<'2026-10-12'){render();return}selectedDate=e.target.value;reviewOverride=false;render()};document.getElementById('toggle').onclick=()=>{reviewOverride=!reviewOverride;render()};let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
window.addEventListener('appinstalled',()=>{installPrompt=null;toast('홈 화면에 추가됐어요! 🌷')});
const hosted=location.protocol==='https:'||location.hostname==='localhost';
document.getElementById('share').onclick=async()=>{
 if(!hosted){toast('웹사이트 주소로 접속한 뒤 공유해 주세요.');return}
 const url=location.origin+location.pathname;
 try{if(navigator.share)await navigator.share({title:'오늘 두 문장 🌷',text:'매일 두 문장씩 함께 공부해요!',url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);toast('앱 주소를 복사했어요! 친구에게 보내세요.')}else prompt('이 주소를 친구에게 보내세요',url)}catch(e){if(e.name!=='AbortError')toast('앱 주소 공유를 다시 시도해 주세요.')}
};
document.getElementById('install').onclick=async()=>{
 if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return}
 if(!hosted){toast('웹사이트 주소로 접속한 뒤 설치해 주세요.');return}
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
 toast(ios?'Safari 공유 버튼 → 홈 화면에 추가를 누르세요.':'브라우저 메뉴(⋮) → 홈 화면에 추가 또는 앱 설치를 누르세요.');
};
if('serviceWorker' in navigator&&hosted)navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();setInterval(()=>{if(dayInfo().key!==current)render()},30000);</script></body></html>
